<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Rubayed Hasan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="container section">
      <h2 class="section-title text-center">Let's Build Something Great</h2>
      <p class="text-center" style="color:var(--muted); margin-bottom:40px;">Have a project in mind? Drop a message. I usually reply within a few hours.</p>
      <div class="grid-2" style="display:grid; grid-template-columns: 1fr; gap:30px; max-width:900px; margin:0 auto;">
        <div class="card">
          <h3>Contact Info</h3>
          <p style="margin-top:15px;"><strong>Phone:</strong> <span id="cPhone"></span></p>
          <p><strong>Email:</strong> <span id="cEmail"></span></p>
          <p><strong>Location:</strong> <span id="cLoc"></span></p>
          <p><strong>Website:</strong> <span id="cWeb"></span></p>
          <div style="margin-top:20px; height:200px; background:#222; border-radius:10px; display:flex; justify-content:center; align-items:center; color:var(--muted);">Google Map Placeholder</div>
        </div>
        <div class="card">
          <h3>Send a Message</h3>
          <input type="text" placeholder="Your Name" style="width:100%; padding:12px; margin-top:15px; margin-bottom:10px; background:#000; border:1px solid var(--border); color:#fff; border-radius:8px;">
          <input type="email" placeholder="Your Email" style="width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid var(--border); color:#fff; border-radius:8px;">
          <textarea placeholder="Your Message" rows="4" style="width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid var(--border); color:#fff; border-radius:8px;"></textarea>
          <button class="btn btn-primary" style="width:100%;">Send Message</button>
        </div>
      </div>
    </section>
  </main>

  <div id="chatWidget" class="chat-widget">
    <div class="chat-header">
      <img src="images/profile.png">
      <div><b>Rubayed Hasan</b><br><small style="color:var(--accent);">Virtual Assistant</small></div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button id="chatSendBtn">Send</button>
    </div>
  </div>
  <button class="floating-chat-btn" id="floatingChatBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3.04 1.04 4.35L2 22l5.65-1.04A9.95 9.95 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
</body>
</html>
