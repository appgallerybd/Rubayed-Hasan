<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0705">
  <title>Admin Panel | Rubayed Hasan</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form class="login-box" id="loginForm" onsubmit="return false" autocomplete="on">
      <img src="images/profile.png" alt="Admin" class="login-avatar">
      <h2 style="color:var(--accent); margin-bottom:20px;">Admin Login</h2>
      <label class="sr-only" for="adminEmail">Email</label>
      <input type="email" id="adminEmail" name="email" placeholder="Email" autocomplete="username" required>
      <label class="sr-only" for="adminPass">Password</label>
      <input type="password" id="adminPass" name="password" placeholder="Password" autocomplete="current-password" required>
      <button id="loginBtn" class="btn btn-primary" style="width:100%; margin-top:10px;" type="button">Log In</button>
      <p id="login-error" role="alert" style="color:#ef4444; margin-top:10px; display:none;"></p>
    </form>
  </div>

  <div class="admin-layout" id="adminPanel" style="display:none;">
    <div class="mobile-header">
      <span style="font-weight:700; color:var(--accent);">Admin Panel</span>
      <button type="button" aria-label="Toggle menu" onclick="document.getElementById('sidebar').classList.toggle('active')" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">☰</button>
    </div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand">Dashboard Menu</div>
      <a href="#settings" class="nav-item active" onclick="switchTab(event, 'tab-settings')">Settings</a>
      <a href="#projects" class="nav-item" onclick="switchTab(event, 'tab-projects')">Projects</a>
      <a href="#blogs" class="nav-item" onclick="switchTab(event, 'tab-blogs')">Blogs</a>
      <a href="#chatbot" class="nav-item" onclick="switchTab(event, 'tab-chatbot')">Chatbot Q&A</a>
      <div style="margin-top:auto; padding:20px;">
        <button id="logoutBtn" class="btn btn-danger" style="width:100%;" type="button">Logout</button>
      </div>
    </div>

    <main class="main-content">
      <div id="adminNotice" class="admin-notice" role="status" aria-live="polite" hidden></div>
      <section id="tab-settings" class="tab-content active">
        <h2>Site Settings</h2>
        <div class="form-container grid-2">
          <div class="input-group"><label for="hero_title_en">Hero Title</label><input type="text" id="hero_title_en"></div>
          <div class="input-group"><label for="hero_tagline_en">Hero Tagline</label><textarea id="hero_tagline_en"></textarea></div>
          <div class="input-group"><label for="about_en">About Text</label><textarea id="about_en"></textarea></div>
          <div class="input-group"><label for="blog_desc_en">Blog Desc</label><textarea id="blog_desc_en"></textarea></div>
          <div class="input-group"><label for="footer_about_en">Footer About</label><textarea id="footer_about_en"></textarea></div>
          <div class="input-group"><label for="contact_phone">Contact Phone</label><input type="text" id="contact_phone"></div>
          <div class="input-group"><label for="contact_email">Contact Email</label><input type="email" id="contact_email"></div>
          <div class="input-group"><label for="contact_loc">Contact Location</label><input type="text" id="contact_loc"></div>
          <div class="input-group"><label for="highlight_color">Highlight Color</label><input type="color" id="highlight_color" style="height:40px;"></div>
        </div>
        <button class="btn btn-primary" type="button" onclick="saveSettings()">Save Settings</button>
      </section>

      <section id="tab-projects" class="tab-content">
        <h2>Projects</h2>
        <button class="btn btn-primary" type="button" onclick="document.getElementById('projForm').style.display='block'">+ Add Project</button>
        <div class="form-container" id="projForm" style="display:none; margin-top:20px;">
          <input type="text" id="projTitle" placeholder="Title" maxlength="160" style="width:100%; margin-bottom:10px; padding:10px;">
          <input type="text" id="projCat" placeholder="Category" maxlength="100" style="width:100%; margin-bottom:10px; padding:10px;">
          <textarea id="projDesc" placeholder="Description" maxlength="5000" style="width:100%; margin-bottom:10px; padding:10px;"></textarea>
          <label><input type="file" id="projImg" accept="image/jpeg,image/png,image/webp,image/gif" style="margin-bottom:10px;"> Project image (max 5 MB)</label>
          <label><input type="checkbox" id="projFeatured"> Featured on Home</label><br><br>
          <button class="btn btn-primary" type="button" onclick="addProject()">Save</button>
        </div>
        <div id="adminProjectsList" style="margin-top:20px;"></div>
      </section>

      <section id="tab-blogs" class="tab-content">
        <h2>Blogs</h2>
        <button class="btn btn-primary" type="button" onclick="document.getElementById('blogForm').style.display='block'">+ Add Blog</button>
        <div class="form-container" id="blogForm" style="display:none; margin-top:20px;">
          <input type="text" id="blogTitle" placeholder="Title" maxlength="200" style="width:100%; margin-bottom:10px; padding:10px;">
          <input type="text" id="blogReadTime" placeholder="Read Time (e.g. 5 min read)" maxlength="40" style="width:100%; margin-bottom:10px; padding:10px;">
          <textarea id="blogContent" placeholder="Content (Use BB for Bold, HH for Highlight)" maxlength="30000" style="width:100%; height:150px; margin-bottom:10px; padding:10px;"></textarea>
          <label><input type="file" id="blogImg" accept="image/jpeg,image/png,image/webp,image/gif" style="margin-bottom:10px;"> Cover image (max 5 MB)</label>
          <button class="btn btn-primary" type="button" onclick="addBlog()">Save</button>
        </div>
        <div id="adminBlogsList" style="margin-top:20px;"></div>
      </section>

      <section id="tab-chatbot" class="tab-content">
        <h2>Chatbot Q&A</h2>
        <button class="btn btn-primary" type="button" onclick="document.getElementById('chatForm').style.display='block'">+ Add Q&A</button>
        <div class="form-container" id="chatForm" style="display:none; margin-top:20px;">
          <input type="text" id="chatQ" placeholder="Question (English)" maxlength="500" style="width:100%; margin-bottom:10px; padding:10px;">
          <textarea id="chatA" placeholder="Answer (English)" maxlength="5000" style="width:100%; height:80px; margin-bottom:10px; padding:10px;"></textarea>
          <button class="btn btn-primary" type="button" onclick="addChatbot()">Save</button>
        </div>
        <div id="adminChatbotList" style="margin-top:20px;"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
