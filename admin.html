<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Rubayed Hasan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* Basic fallback styles if admin.css is missing */
    .login-box { max-width: 400px; margin: 100px auto; padding: 40px; background: #17110d; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; }
    .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; background: #111; border: 1px solid #333; color: #fff; border-radius: 10px; font-family: inherit; }
    .login-box button { width: 100%; padding: 14px; background: #d4af37; color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .login-box button:hover { filter: brightness(1.1); }
    #login-error { color: #ef4444; font-size: 14px; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-box">
      <img src="images/profile.png" alt="Admin" style="width:80px; height:80px; border-radius:50%; border:2px solid #d4af37; margin-bottom:20px;">
      <h2 style="color:#d4af37; margin-bottom:10px;">Admin Login</h2>
      <p style="color:#8f857d; font-size:14px; margin-bottom:20px;">Sign in with your authorized email and password.</p>
      
      <input type="email" id="adminEmail" placeholder="Email Address" autocomplete="email">
      <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
      
      <button type="button" id="loginBtn">Log In</button>
      <p id="login-error"></p>
    </div>
  </div>

  <!-- Admin Dashboard (Hidden by default) -->
  <div class="admin-layout" id="adminPanel" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="images/profile.png" alt="Logo"><span>Admin Panel</span></div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-target="dashboard">Dashboard</a>
        <a href="#" class="nav-item" data-target="projects">Manage Projects</a>
        <a href="#" class="nav-item" data-target="reviews">Manage Reviews</a>
        <a href="#" class="nav-item" data-target="settings">Site Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" target="_blank">View Website</a>
        <button id="logoutBtn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <section id="dashboard" class="tab-content active">
        <h1>Dashboard Overview</h1>
        <div class="stats-row">
          <div class="stat-card"><h3>Total Projects</h3><p id="statProjects">0</p></div>
          <div class="stat-card"><h3>Total Reviews</h3><p id="statReviews">0</p></div>
        </div>
      </section>

      <section id="projects" class="tab-content">
        <h1>Manage Projects</h1>
        <div class="form-container" id="projectFormContainer" style="display:none;">
          <h2>Add New Project</h2>
          <form id="projectForm">
            <input type="hidden" id="projId">
            <div class="input-group"><label>Project Name</label><input type="text" id="projName" required></div>
            <div class="input-group"><label>Category (EN)</label><input type="text" id="projCatEn" required></div>
            <div class="input-group"><label>Category (BN)</label><input type="text" id="projCatBn" required></div>
            <div class="input-group"><label>Image File</label><input type="file" id="projImage" accept="image/*"></div>
            <button type="submit" class="btn btn-primary">Save Project</button>
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('projectFormContainer').style.display='none'">Cancel</button>
          </form>
        </div>
        <button class="btn btn-primary" id="addProjectBtn" style="margin-bottom:20px;">+ Add New Project</button>
        <div id="projectsTable"></div>
      </section>

      <section id="reviews" class="tab-content">
        <h1>Manage Reviews</h1>
        <div class="form-container" id="reviewFormContainer" style="display:none;">
          <h2>Add New Review</h2>
          <form id="reviewForm">
            <input type="hidden" id="revId">
            <div class="input-group"><label>Client Name</label><input type="text" id="revName" required></div>
            <div class="input-group"><label>Role / Org</label><input type="text" id="revRole" required></div>
            <div class="input-group"><label>Review (EN)</label><textarea id="revTextEn" rows="3" required></textarea></div>
            <div class="input-group"><label>Review (BN)</label><textarea id="revTextBn" rows="3" required></textarea></div>
            <button type="submit" class="btn btn-primary">Save Review</button>
            <button type="button" class="btn btn-ghost" onclick="document.getElementById('reviewFormContainer').style.display='none'">Cancel</button>
          </form>
        </div>
        <button class="btn btn-primary" id="addReviewBtn" style="margin-bottom:20px;">+ Add New Review</button>
        <div id="reviewsTable"></div>
      </section>

      <section id="settings" class="tab-content">
        <h1>Site Settings</h1>
        <div class="form-container">
          <form id="settingsForm">
            <div class="input-group"><label>Hero Title (EN)</label><input type="text" id="set_hero_title_en"></div>
            <div class="input-group"><label>Hero Title (BN)</label><input type="text" id="set_hero_title_bn"></div>
            <div class="input-group"><label>Hero Tagline (EN)</label><textarea id="set_hero_tagline_en" rows="2"></textarea></div>
            <div class="input-group"><label>Hero Tagline (BN)</label><textarea id="set_hero_tagline_bn" rows="2"></textarea></div>
            <div class="input-group"><label>About (EN)</label><textarea id="set_about_text_en" rows="4"></textarea></div>
            <div class="input-group"><label>About (BN)</label><textarea id="set_about_text_bn" rows="4"></textarea></div>
            <div class="input-group"><label>Experience</label><input type="number" id="set_stat_experience"></div>
            <div class="input-group"><label>Total Projects</label><input type="number" id="set_stat_projects"></div>
            <div class="input-group"><label>Happy Clients (%)</label><input type="number" id="set_stat_clients"></div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- Supabase CDN MUST BE LOADED BEFORE ADMIN.JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
                                                                    </html>
