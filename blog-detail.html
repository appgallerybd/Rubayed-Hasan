<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post - Rubayed Hasan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header injected by JS -->

  <main class="container section" style="max-width: 800px; margin: 0 auto;">
    <h1 id="postTitle" class="section-title">Loading...</h1>
    <p id="postMeta" style="color:var(--accent); font-size: 14px; margin-bottom:20px;"></p>
    <img id="postImage" style="width:100%; border-radius:16px; margin-bottom:30px;">
    <div id="postContent" class="blog-content"></div>
  </main>

  <!-- Scroll Buttons -->
  <div class="progress-circle" id="progressBar">
    <div class="progress-inner" onclick="window.scrollBy({top: 500, behavior: 'smooth'})">↓</div>
  </div>
  <div class="progress-circle up-btn" id="scrollUpBtn" style="bottom: 90px;" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <div class="progress-inner">↑</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
  <script>
    const supabase = window.supabase.createClient('https://qynaqzukiwtnxjsciazk.supabase.co', 'sb_publishable_dTX5xkv4svMJA9-M5QMHKA_YctCIi19');
    
    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if(!id) return;

      // Get Highlight Color
      const { data: sets } = await supabase.from('site_settings').select('value').eq('key', 'highlight_color').single();
      const hlColor = sets ? sets.value : '#d4af37';
      document.documentElement.style.setProperty('--highlight', hlColor);

      const { data } = await supabase.from('blog_posts').select('*').eq('id', id).single();
      if(data) {
        document.getElementById('postTitle').textContent = data.title_en;
        document.getElementById('postMeta').textContent = `Category: Design • ${data.read_time}`;
        document.getElementById('postImage').src = data.image_url;
        // formatText function is global in main.js
        document.getElementById('postContent').innerHTML = window.formatText(data.content_en, hlColor);
      }
    }
    loadPost();
  </script>
</body>
</html>
