<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Rubayed Hasan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header injected by JS -->
  <main>
    <section class="container hero-section" style="align-items: center; text-align: center;">
      <div class="hero-image-wrapper" style="margin: 0 auto 30px; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;">
        <img src="images/profile.png" style="border-radius: inherit;">
      </div>
      <h1 class="hero-title">About Me</h1>
      <p class="hero-tagline" id="aboutTeaser" style="margin: 0 auto 30px;">I am a graphic designer based in Khulna.</p>
      <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
        <a href="contact.html" class="btn btn-primary">Contact for Your Design</a>
        <a href="portfolio.html" class="btn btn-ghost">Featured Case Studies</a>
      </div>
    </section>
    
    <section class="container section">
      <h2 class="section-title">My Toolkit</h2>
      <div class="grid-3" style="margin-top: 20px;">
        <div class="card text-center"><h3>Adobe Photoshop</h3></div>
        <div class="card text-center"><h3>Adobe Illustrator</h3></div>
        <div class="card text-center"><h3>Corel Draw</h3></div>
        <div class="card text-center"><h3>Canva</h3></div>
      </div>
    </section>
  </main>

  <div id="chatWidget" class="chat-widget">
    <div class="chat-header">
      <img src="images/profile.png">
      <div><b>Rubayed Hasan</b><br><small style="color:var(--accent);">Virtual Assistant</small></div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button id="chatSendBtn">Send</button>
    </div>
  </div>
  <button class="floating-chat-btn" id="floatingChatBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3.04 1.04 4.35L2 22l5.65-1.04A9.95 9.95 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/main.js"></script>
</body>
</html>
